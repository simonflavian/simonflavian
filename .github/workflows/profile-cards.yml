name: Profile cards

on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/generate.py, .github/workflows/profile-cards.yml]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.0.0
      - name: Render cards
        id: render
        env:
          GH_USER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: |
          # GITHUB_TOKEN can't read private repos, so it would publish public-only
          # numbers over the real ones. Keep the current cards until the secret exists.
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::PROFILE_TOKEN secret is not set; keeping existing cards."
            exit 0
          fi
          python scripts/generate.py
          echo "rendered=true" >> "$GITHUB_OUTPUT"
      - name: Commit if changed
        if: steps.render.outputs.rendered == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "chore: refresh profile cards"
          git push
